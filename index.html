<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rapport Unité Entraînement</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body{
    min-height:100vh;
    background:
    linear-gradient(135deg,#0b1f12,#263b27,#111);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}


.container{

    width:90%;
    max-width:420px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(20px);
    border-radius:30px;
    padding:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.2);

}


.logo{

    text-align:center;
    font-size:45px;
}


h1{

    text-align:center;
    font-size:24px;
    margin-bottom:25px;

}


h1 span{

    color:#8cff8c;

}


.search-box input{

    width:100%;
    padding:15px;
    border-radius:20px;
    border:none;
    outline:none;
    font-size:16px;

}


.result{

    margin-top:20px;
    background:rgba(0,0,0,.25);
    padding:20px;
    border-radius:20px;
    display:none;

}


.result h2{

    color:#8cff8c;

}



button{

    width:100%;
    margin-top:25px;
    padding:15px;
    border:none;
    border-radius:20px;
    background:#355e3b;
    color:white;
    font-size:17px;
    font-weight:bold;

}


button:hover{

    background:#477d4e;

}


.footer{

    text-align:center;
    margin-top:20px;
    opacity:.6;
    font-size:13px;

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
🪖
</div>


<h1>
Rapport <span>Unité</span><br>
Entraînement
</h1>



<div class="search-box">

<input 
type="text" 
id="soldat"
placeholder="🔎 Rechercher un soldat">


</div>



<div class="result" id="result">

<h2 id="nom"></h2>

<p>
Entraînements réalisés :
<b id="nombre">0</b>
</p>


</div>




<button onclick="administration()">

⚙️ Administration

</button>



<div class="footer">

Système de gestion militaire

</div>



</div>



<script>


function administration(){

let mdp = prompt("Mot de passe administration :");


if(mdp === "Kassano@10"){

alert("Accès administration autorisé");

}

else{

alert("Mot de passe incorrect");

}


}



</script>


</body>
</html>
