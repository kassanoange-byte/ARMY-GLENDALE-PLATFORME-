<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rapport Unité Entraînement</title>

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
background:linear-gradient(135deg,#0b1f0d,#1d3b20,#000);
color:white;
min-height:100vh;
display:flex;
justify-content:center;
}


.app{

width:90%;
max-width:420px;
margin-top:30px;

background:rgba(255,255,255,0.12);
backdrop-filter:blur(20px);

padding:25px;
border-radius:30px;

}


h1{
text-align:center;
}


input,button{

width:100%;
padding:15px;
margin-top:12px;

border:none;
border-radius:20px;

font-size:16px;

}



button{

background:#315f38;
color:white;
font-weight:bold;

}


.card{

background:rgba(0,0,0,.3);
padding:20px;
border-radius:20px;
margin-top:20px;

}


.hidden{

display:none;

}


</style>

</head>


<body>


<div class="app">


<h1>
🪖 Rapport<br>
Unité Entraînement
</h1>


<!-- RECHERCHE -->


<div id="recherche">


<h3>🔎 Recherche Soldat</h3>


<input id="rechercheNom" placeholder="Nom du soldat">


<button onclick="chercher()">
Rechercher
</button>


<div id="resultat" class="card hidden">

<h3 id="nomResultat"></h3>

<p id="gradeResultat"></p>

<p>
Entraînements :
<b id="nombreResultat"></b>
</p>


</div>


<button onclick="ouvrirAdmin()">

⚙️ Administration

</button>


</div>




<!-- ADMIN -->


<div id="admin" class="hidden">


<h2>
⚙️ Administration
</h2>


<input id="nom" placeholder="Nom du soldat">


<input id="grade" placeholder="Grade">


<button onclick="ajouterSoldat()">

➕ Ajouter au rapport

</button>


<div class="card">

<h3>Rapport actuel</h3>

<div id="liste"></div>

</div>


<button onclick="retour()">

⬅️ Retour recherche

</button>


</div>


</div>





<script>


let soldats = JSON.parse(localStorage.getItem("soldats")) || [];



function chercher(){


let nom = document.getElementById("rechercheNom").value.toLowerCase();


let trouve = soldats.filter(
s => s.nom.toLowerCase() === nom
);



if(trouve.length>0){


document.getElementById("resultat").classList.remove("hidden");


document.getElementById("nomResultat").innerHTML =
"🪖 "+trouve[0].nom;


document.getElementById("gradeResultat").innerHTML =
"🎖 Grade : "+trouve[0].grade;



document.getElementById("nombreResultat").innerHTML =
trouve.length;



}

else{


alert("Soldat introuvable");


}



}




function ouvrirAdmin(){


let mdp = prompt("Mot de passe administration");


if(mdp==="Kassano@10"){


document.getElementById("recherche").classList.add("hidden");

document.getElementById("admin").classList.remove("hidden");


afficherListe();


}

else{


alert("Mot de passe incorrect");


}


}





function ajouterSoldat(){


let nom=document.getElementById("nom").value;

let grade=document.getElementById("grade").value;



if(nom==="" || grade===""){

alert("Remplis tous les champs");

return;

}



soldats.push({

nom:nom,

grade:grade,

date:new Date().toLocaleDateString()

});



localStorage.setItem(
"soldats",
JSON.stringify(soldats)
);



alert("Soldat enregistré");


afficherListe();


}





function afficherListe(){


let liste=document.getElementById("liste");


liste.innerHTML="";


soldats.forEach(s=>{


liste.innerHTML +=

`
<p>
🪖 ${s.nom}<br>
🎖 ${s.grade}<br>
📅 ${s.date}
</p>
<hr>
`;


});


}





function retour(){


document.getElementById("admin").classList.add("hidden");

document.getElementById("recherche").classList.remove("hidden");


}



</script>


</body>

</html>
