<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rapport Unité Entraînement</title>


<style>

*{
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}


body{

margin:0;
min-height:100vh;

background:
radial-gradient(circle at top,#496b3b,#071107 60%);

color:white;

display:flex;
justify-content:center;

}


.container{

width:92%;
max-width:430px;

margin-top:30px;

padding:25px;

background:rgba(255,255,255,0.13);

border:1px solid rgba(255,255,255,0.25);

backdrop-filter:blur(25px);

-webkit-backdrop-filter:blur(25px);

border-radius:35px;

box-shadow:
0 20px 50px rgba(0,0,0,.5);


}



.logo{

font-size:55px;
text-align:center;

}


h1{

text-align:center;
font-size:26px;

}



span{

color:#9cff88;

}



input{

width:100%;

padding:16px;

margin-top:15px;

border-radius:18px;

border:none;

outline:none;

background:rgba(255,255,255,.18);

color:white;

font-size:16px;


}



input::placeholder{

color:#ddd;

}



button{

width:100%;

padding:16px;

margin-top:15px;

border-radius:20px;

border:none;

background:
linear-gradient(135deg,#315d36,#1c351f);

color:white;

font-size:17px;

font-weight:bold;

}



.card{

margin-top:20px;

padding:20px;

background:rgba(0,0,0,.25);

border-radius:25px;

border:1px solid rgba(255,255,255,.15);


}



.hidden{

display:none;

}



.title{

text-align:center;

font-size:20px;

}



</style>

</head>



<body>


<div class="container">


<div class="logo">
🪖
</div>


<h1>
Rapport<br>
<span>Unité Entraînement</span>
</h1>



<!-- RECHERCHE -->


<div id="home">


<h3>
🔎 Recherche Soldat
</h3>


<input id="search"
placeholder="Nom du soldat">


<button onclick="rechercher()">

🔍 Rechercher

</button>



<div id="result" class="card hidden">


<h2 id="nomResult"></h2>

<p id="gradeResult"></p>

<p>
📊 Nombre d'entraînements :
<b id="countResult"></b>
</p>



</div>



<button onclick="adminLogin()">

⚙️ Administration

</button>


</div>




<!-- ADMIN -->


<div id="admin" class="hidden">


<h2 class="title">

⚙️ Administration

</h2>


<input id="soldatNom"
placeholder="Nom du soldat">


<input id="soldatGrade"
placeholder="Grade du soldat">



<button onclick="ajouter()">

➕ Ajouter entraînement

</button>



<div class="card">

<h3>
📋 Derniers rapports
</h3>


<div id="liste"></div>


</div>



<button onclick="retour()">

⬅️ Retour

</button>



</div>



</div>





<script>


let rapports =
JSON.parse(localStorage.getItem("rapports")) || [];




// RECHERCHE


function rechercher(){


let nom = document.getElementById("search")
.value
.trim()
.toLowerCase();



let soldats = rapports.filter(r =>
r.nom.trim().toLowerCase().includes(nom)
);



if(soldats.length){


document.getElementById("result")
.classList.remove("hidden");


document.getElementById("nomResult").innerHTML=
"🪖 "+soldats[0].nom;



document.getElementById("gradeResult").innerHTML=
"🎖 Grade : "+soldats[0].grade;



document.getElementById("countResult").innerHTML=
soldats.length;


}

else{


alert("Soldat introuvable");


}



}




// ADMIN


function adminLogin(){


let pass=prompt(
"Mot de passe administration"
);


if(pass==="Kassano@10"){


home.classList.add("hidden");

admin.classList.remove("hidden");

afficher();


}

else{


alert("Mot de passe incorrect");


}


}





function ajouter(){


let nom =
document.getElementById("soldatNom").value;


let grade =
document.getElementById("soldatGrade").value;



if(!nom || !grade){

alert("Complète les informations");

return;

}



rapports.push({

nom:nom,

grade:grade,

date:new Date().toLocaleDateString()

});



localStorage.setItem(
"rapports",
JSON.stringify(rapports)
);



alert("Rapport enregistré");


afficher();



}





function afficher(){


liste.innerHTML="";


rapports.slice(-10).reverse()
.forEach(r=>{


liste.innerHTML +=

`

<p>
🪖 ${r.nom}<br>
🎖 ${r.grade}<br>
📅 ${r.date}
</p>
<hr>

`;


});


}





function retour(){


admin.classList.add("hidden");

home.classList.remove("hidden");


}



</script>


</body>

</html>
